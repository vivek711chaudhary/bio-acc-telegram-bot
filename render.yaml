services:
  - type: web
    name: bioaccbot
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: PORT
        value: 3000
      - key: WEBHOOK_URL
        sync: false 